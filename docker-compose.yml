services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-research_agent}
      MYSQL_USER: ${MYSQL_USER:-research}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-research-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-research}:${MYSQL_PASSWORD:-research-local-only}@mysql:3306/${MYSQL_DATABASE:-research_agent}
      API_KEY: ${API_KEY:?Set API_KEY in .env (copy and edit .env.example)}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MODEL_NAME: ${MODEL_NAME:-phi3}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      MAX_QUESTION_LENGTH: ${MAX_QUESTION_LENGTH:-2000}
      CONVERSATION_HISTORY_LIMIT: ${CONVERSATION_HISTORY_LIMIT:-10}
      HISTORY_TOKEN_BUDGET: ${HISTORY_TOKEN_BUDGET:-500}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20000000}
      UPLOAD_DIRECTORY: /app/data/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads

volumes:
  mysql_data:
  qdrant_data:
